<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>For You 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle, #ffafbd, #ffc3a0);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        #card {
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            padding: 40px 20px;
            border-radius: 40px;
            width: 80%;
            text-align: center;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .emoji { font-size: 70px; margin-bottom: 20px; display: block; }
        h1 { color: white; font-size: 22px; margin-bottom: 30px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }

        .btn {
            width: 100%;
            padding: 22px;
            border-radius: 20px;
            border: none;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px; /* Jarak tombol */
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn { background: #ff4d6d; color: white; box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4); }
        #noBtn { background: white; color: #ff4d6d; position: relative; }

        #final {
            display: none;
            position: fixed;
            inset: 0;
            background: #ff4d6d;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body onclick="initHaptic()"> <div id="card">
        <span class="emoji">🥺✨</span>
        <h1>Sayang, kamu mau kan <br> jadi pacar aku?</h1>
        
        <button id="yesBtn" class="btn">MAU! 💖</button>
        <button id="noBtn" class="btn">Gak Mau 😋</button>
    </div>

    <div id="final">
        <span style="font-size: 100px;">🥰</span>
        <h1>YAY! I LOVE YOU!</h1>
        <p>Terima kasih sudah pilih aku ✨</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const final = document.getElementById('final');

        // FUNGSI KUNCI: Memicu izin haptik di iOS 26.1
        let hapticReady = false;
        function initHaptic() {
            if (!hapticReady) {
                if (navigator.vibrate) navigator.vibrate(10); // Tes getar kecil
                hapticReady = true;
            }
        }

        function lari(e) {
            if (e) e.preventDefault();
            
            // Haptik khusus saat gagal/kabur
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;

            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Pakai touchstart untuk respon kilat iPhone
        noBtn.addEventListener('touchstart', lari);
        noBtn.addEventListener('click', lari);

        yesBtn.addEventListener('click', () => {
            // Getar panjang tanda sukses
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            
            document.getElementById('card').style.transition = "0.4s";
            document.getElementById('card').style.transform = "scale(0) rotate(20deg)";
            
            setTimeout(() => {
                final.style.display = 'flex';
            }, 400);
        });
    </script>
</body>
</html>
