<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* LOCK SCROLL */
html, body {
    width: 390px;
    height: 844px;
    position: fixed;
    overflow: hidden;
    touch-action: none;
}

body {
    background: linear-gradient(135deg, #ff9ecf, #ffc1e3);
    display: flex;
    justify-content: center;
    align-items: center;
}

.page {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 1.2s ease;
}

.hidden {
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
}

h1 {
    font-size: 28px;
    color: white;
    text-align: center;
    margin-bottom: 40px;
}

.btn {
    padding: 15px 25px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    margin: 10px;
}

.yes {
    background: #ff4fa3;
    color: white;
    box-shadow: 0 0 20px rgba(255, 79, 163, 0.6);
}

.no {
    background: white;
    color: #ff4fa3;
    position: absolute;
}

/* HEART TRAIL */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 1s ease-out forwards;
    pointer-events: none;
}

@keyframes float {
    to {
        transform: translateY(-50px);
        opacity: 0;
    }
}

/* PAGE 2 */
.success {
    background: linear-gradient(135deg, #ff4fa3, #ff85c1);
    color: white;
    text-align: center;
}

.big-heart {
    font-size: 60px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* LOVE RAIN */
.rain-heart {
    position: absolute;
    top: -20px;
    font-size: 20px;
    animation: rain 4s linear infinite;
    pointer-events: none;
}

@keyframes rain {
    to {
        transform: translateY(900px);
        opacity: 0;
    }
}

/* SHAKE */
.shake {
    animation: shakeAnim 0.4s;
}

@keyframes shakeAnim {
    0% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-10px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div id="page1" class="page">
    <h1>💖 Kamu mau jadi pacarku? 💖</h1>

    <button class="btn yes" onclick="acceptLove()">😍 Mau</button>
    <button class="btn no" id="noBtn">😢 Tidak Mau</button>
</div>

<div id="page2" class="page hidden success">
    <div class="big-heart">💖</div>
    <h1>YEAAY!! 🥰💖<br>Aku seneng banget kamu mau! 💕</h1>
</div>

<script>
// cegah scroll iOS
document.addEventListener("touchmove", function(e) {
    e.preventDefault();
}, { passive: false });

const maxX = 390 - 120;
const maxY = 844 - 60;

const noBtn = document.getElementById("noBtn");
const page1 = document.getElementById("page1");

// posisi awal sejajar & di bawah tombol mau
window.onload = () => {
    const yesBtn = document.querySelector(".yes");
    const yesRect = yesBtn.getBoundingClientRect();

    let posX = (390 / 2) - (noBtn.offsetWidth / 2);
    let posY = yesRect.bottom + 30;

    if (posY > 844 - 60) posY = 844 - 60;

    noBtn.style.left = posX + "px";
    noBtn.style.top = posY + "px";
};

// LOVE RAIN
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "rain-heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 390 + "px";
    heart.style.animationDuration = (3 + Math.random() * 2) + "s";

    page1.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 300);

// tombol kabur + geleng
noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("mouseover", moveButton);

function moveButton() {
    page1.classList.add("shake");
    setTimeout(() => page1.classList.remove("shake"), 400);

    let randomX = Math.random() * maxX;
    let randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

// heart trail
document.addEventListener("touchmove", createHeart);
document.addEventListener("mousemove", createHeart);

function createHeart(e) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = (e.touches ? e.touches[0].clientX : e.clientX) + "px";
    heart.style.top = (e.touches ? e.touches[0].clientY : e.clientY) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1000);
}

// MAU → 1000 LOVE NAIK
function acceptLove() {
    const total = 1000;
    let count = 0;

    const interval = setInterval(() => {
        for (let i = 0; i < 20; i++) {
            if (count >= total) break;

            let love = document.createElement("div");
            love.innerHTML = "😍";
            love.style.pointerEvents = "none";

            love.style.position = "absolute";
            love.style.fontSize = (20 + Math.random() * 15) + "px";
            love.style.left = Math.random() * 390 + "px";
            love.style.top = "844px";
            love.style.transition = "transform 1.5s linear, opacity 1.5s";

            document.body.appendChild(love);

            setTimeout(() => {
                love.style.transform = `translateY(-${900 + Math.random()*300}px)`;
                love.style.opacity = 0;
            }, 10);

            setTimeout(() => love.remove(), 1600);

            count++;
        }

        if (count >= total) clearInterval(interval);
    }, 40);

    const page2 = document.getElementById("page2");

    page1.classList.add("hidden");

    setTimeout(() => {
        page2.classList.remove("hidden");
    }, 1500);
}
</script>

</body>
</html>
