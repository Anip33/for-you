<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Love ❤️</title>
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --soft-pink: #ff85a1;
            --glass: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        /* Latar belakang partikel hati */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 390px; /* Lebar iPhone 13 */
            height: 80vh;
            padding: 20px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            position: relative;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .gif-container img {
            width: 150px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
            position: relative;
            height: 150px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yes-btn {
            background-color: var(--primary-pink);
            color: white;
            z-index: 10;
        }

        #no-btn {
            background-color: white;
            color: var(--primary-pink);
            position: absolute;
            top: 75px; /* Jarak di bawah tombol Mau */
            transition: all 0.3s ease;
        }

        /* Halaman Sukses */
        .success-content {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
        }

        .show-success .main-content { display: none; }
        .show-success .success-content { 
            display: block; 
            opacity: 1; 
            transform: scale(1);
        }

        /* Efek Transisi Keren */
        .flash-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pink-flash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>
    <div class="flash-effect" id="flash"></div>

    <div class="container" id="main-card">
        <div class="main-content">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZqZzR3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/cmCHuk53AiFY2ZxlYm/giphy.gif" alt="Cute Cat">
            </div>
            <h1>Halo Sayang... ✨<br>Mau gak jadi pacar aku? 🥺🌷</h1>
            
            <div class="buttons" id="btn-wrapper">
                <button id="yes-btn" onclick="celebrate()">MAAAUUU!!! 💖</button>
                <button id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()">GAAAKKK MAUUUU!!! 🏃‍♂️</button>
            </div>
        </div>

        <div class="success-content">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2Z4eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/K97pG8vC3qE/giphy.gif" width="150" style="margin-bottom: 20px;">
            <h1>ASIIIQQQQ I LOVE U SAYAAANNGGG! 🌸💕✨</h1>
            <p style="font-size: 1.1rem;">JADI MAU CIUUUMM IIIHHHH!!!!!!!!</p>
        </div>
    </div>

    <script>
        // Animasi Hati Berjatuhan
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.zIndex = '1';
            heart.style.opacity = Math.random();
            heart.style.transition = 'transform 3s linear, top 3s linear';
            
            document.getElementById('particles').appendChild(heart);

            setTimeout(() => {
                heart.style.top = '110vh';
                heart.style.transform = `translateX(${Math.random() * 100 - 50}px) rotate(${Math.random() * 360}deg)`;
            }, 100);

            setTimeout(() => heart.remove(), 3000);
        }
        setInterval(createHeart, 300);

        // Logika Tombol "Gak Mau" yang Berpindah secara Pintar
        const noBtn = document.getElementById('no-btn');
        const container = document.getElementById('main-card');

        function moveNoButton() {
            const padding = 20;
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Menghitung batas maksimal perpindahan di dalam container iPhone 13
            const maxX = containerRect.width - btnRect.width - padding;
            const maxY = containerRect.height - btnRect.height - padding;

            // Posisi acak baru
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Terapkan posisi baru
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Fungsi Transisi Keren saat Klik Mau
        function celebrate() {
            const flash = document.getElementById('flash');
            const card = document.getElementById('main-card');
            
            // Efek Flash Cahaya
            flash.style.animation = 'pink-flash 0.6s ease-out';
            
            setTimeout(() => {
                card.classList.add('show-success');
                // Tambahkan lebih banyak hati
                for(let i=0; i<50; i++) {
                    setTimeout(createHeart, i * 50);
                }
            }, 300);
        }
    </script>
</body>
</html>
