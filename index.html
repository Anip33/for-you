<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    position: relative;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: white;
    animation: float 6s linear infinite;
    opacity: 0.7;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(0.5); }
    100% { transform: translateY(-10vh) scale(1.2); }
}

/* Container */
.page {
    width: 100%;
    height: 100%;
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    transition: all 0.8s ease;
}

/* Hidden page */
.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
}

/* Text */
h1 {
    color: white;
    text-align: center;
    font-size: 26px;
    margin-bottom: 30px;
}

/* Buttons */
.btn {
    width: 220px;
    padding: 14px;
    border-radius: 30px;
    border: none;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

/* YES BUTTON */
.yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.yes:active {
    transform: scale(1.2);
    background: #ff1e4d;
}

/* NO BUTTON */
.no {
    background: white;
    color: #ff4d6d;
    position: relative;
}

/* Success animation */
@keyframes loveBurst {
    0% { transform: scale(1); }
    50% { transform: scale(1.5) rotate(10deg); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page1">
    <h1>💖 Mau jadi pacarku? 💖</h1>
    
    <button class="btn yes" onclick="acceptLove()">Mau 💕</button>
    <button class="btn no" id="noBtn">Tidak Mau 😢</button>
</div>

<!-- PAGE 2 -->
<div class="page hidden" id="page2">
    <h1>💞 Yeay!!! 💞<br>Kamu sekarang milikku 💖</h1>
</div>

<script>

/* HEART ANIMATION */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}
setInterval(createHeart, 500);

/* NO BUTTON MOVE */
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("mouseover", moveButton);

function moveButton() {
    const maxX = 390 - 220; 
    const maxY = 844 - 60;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

/* ACCEPT LOVE */
function acceptLove() {
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    page1.style.animation = "loveBurst 0.6s";

    setTimeout(() => {
        page1.classList.add("hidden");
        page2.classList.remove("hidden");
    }, 500);
}

</script>

</body>
</html>
