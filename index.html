<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    position: relative;
}

/* PAGE */
.page {
    width: 100%;
    height: 100%;
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: all 0.8s ease;
}

/* SECOND PAGE */
#page2 {
    opacity: 0;
    transform: scale(1.3);
    pointer-events: none;
    filter: blur(10px);
}

/* TEXT */
h1 {
    text-align: center;
    font-size: 26px;
    color: white;
    margin-bottom: 40px;
    padding: 0 20px;
}

/* BUTTONS */
.btn {
    width: 240px;
    padding: 16px;
    border: none;
    border-radius: 40px;
    font-size: 18px;
    margin: 12px;
    transition: 0.3s;
}

/* YES BUTTON */
#yesBtn {
    background: white;
    color: #ff4d6d;
    font-weight: bold;
}

/* NO BUTTON */
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
}

/* HEART */
.heart, .confetti {
    position: absolute;
    font-size: 20px;
    animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-300px) scale(2); opacity: 0; }
}

/* TRANSITION */
.show {
    opacity: 1 !important;
    transform: scale(1) !important;
    filter: blur(0) !important;
    pointer-events: all !important;
}

.hide {
    opacity: 0;
    transform: scale(0.8);
    filter: blur(10px);
}
</style>
</head>

<body>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<!-- PAGE 1 -->
<div id="page1" class="page">
    <h1>💖 Kamu mau jadi pacarku nggak? 🥺</h1>

    <button id="yesBtn" class="btn">Mau 💕</button>
    <button id="noBtn" class="btn">Tidak 😢</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h1>💖 YAAAY!!! 💖<br>Aku serius seneng banget 😭💕</h1>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const music = document.getElementById("music");

/* SCREEN SIZE */
function getMax() {
    return {
        w: window.innerWidth - 240,
        h: window.innerHeight - 100
    };
}

/* MOVE NO BUTTON */
function moveNoBtn() {
    const max = getMax();
    let x = Math.random() * max.w;
    let y = Math.random() * max.h;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

/* EVENTS */
noBtn.addEventListener("touchstart", moveNoBtn);
noBtn.addEventListener("mouseover", moveNoBtn);

/* YES CLICK */
yesBtn.addEventListener("click", () => {
    // HAPTIC (iPhone)
    if (navigator.vibrate) navigator.vibrate(50);

    music.play();

    createHearts();
    createConfetti();

    page1.classList.add("hide");

    setTimeout(() => {
        page2.classList.add("show");
    }, 500);
});

/* HEART EFFECT */
function createHearts() {
    for (let i = 0; i < 25; i++) {
        let el = document.createElement("div");
        el.className = "heart";
        el.innerHTML = "💖";
        el.style.left = Math.random() * window.innerWidth + "px";
        el.style.bottom = "0px";

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }
}

/* CONFETTI */
function createConfetti() {
    const emojis = ["💖","✨","💕","🎉"];
    for (let i = 0; i < 30; i++) {
        let el = document.createElement("div");
        el.className = "confetti";
        el.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left = Math.random() * window.innerWidth + "px";
        el.style.bottom = "0px";

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }
}

/* PARALLAX iPhone */
window.addEventListener("deviceorientation", (e) => {
    let x = e.gamma / 20;
    let y = e.beta / 20;

    document.body.style.transform = `translate(${x}px, ${y}px)`;
});

/* INIT */
moveNoBtn();
</script>

</body>
</html>
