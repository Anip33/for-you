<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* PAGE */
.page {
    width: 100%;
    height: 100%;
    position: relative;
}

/* CENTER */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* TEXT */
h1 {
    color: white;
    font-size: 26px;
    margin-bottom: 40px;
}

/* BUTTON */
.btn {
    width: 240px;
    padding: 16px;
    border-radius: 40px;
    border: none;
    font-size: 18px;
    transition: 0.3s ease;
}

/* YES */
#yesBtn {
    background: white;
    color: #ff4d6d;
    margin-bottom: 15px;
}

/* NO */
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
    transition: transform 0.25s ease;
}

/* PAGE 2 */
#page2 {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(1.2);
    transition: 0.6s;
    display: flex;
    justify-content: center;
    align-items: center;
}

.show {
    opacity: 1 !important;
    transform: scale(1) !important;
}

/* HEART */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
    to {
        transform: translateY(-300px) scale(2);
        opacity: 0;
    }
}
</style>
</head>

<body>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<div class="page" id="page1">
    <div class="center">
        <h1>💖 Kamu mau jadi pacarku nggak? 🥺</h1>

        <button id="yesBtn" class="btn">Mau 💕</button>
        <button id="noBtn" class="btn">Tidak 😢</button>
    </div>
</div>

<div id="page2">
    <h1>💖 YAAAY!!! 💖<br>Aku seneng banget 😭💕</h1>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page2 = document.getElementById("page2");
const music = document.getElementById("music");

let dodgeLevel = 0;

/* POSISI AWAL */
function setInitialPosition() {
    const yesRect = yesBtn.getBoundingClientRect();
    noBtn.style.left = yesRect.left + "px";
    noBtn.style.top = (yesRect.bottom + 15) + "px";
}

/* GERAK HALUS (bukan teleport) */
function dodge() {
    dodgeLevel++;

    const moveX = (Math.random() - 0.5) * 150 * dodgeLevel;
    const moveY = (Math.random() - 0.5) * 150 * dodgeLevel;

    let currentX = noBtn.offsetLeft;
    let currentY = noBtn.offsetTop;

    let newX = currentX + moveX;
    let newY = currentY + moveY;

    // batas layar
    newX = Math.max(0, Math.min(window.innerWidth - noBtn.offsetWidth, newX));
    newY = Math.max(0, Math.min(window.innerHeight - noBtn.offsetHeight, newY));

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";
}

/* EVENT */
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    dodge();
});

noBtn.addEventListener("mouseover", dodge);

/* YES */
yesBtn.addEventListener("click", () => {
    if (navigator.vibrate) navigator.vibrate(50);
    music.play();

    for (let i = 0; i < 25; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }

    page2.classList.add("show");
});

/* INIT */
window.onload = setInitialPosition;
window.onresize = setInitialPosition;
</script>

</body>
</html>
