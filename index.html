<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Untuk Kamu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --soft-pink: #ffb3c1;
            --deep-love: #c9184a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Animasi Kelopak Bunga */
        .bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Container Utama Pas untuk iPhone 13 */
        .card {
            width: 90%;
            max-width: 350px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            z-index: 10;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--deep-love);
            margin-bottom: 20px;
        }

        .emoji-main {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Jarak antar tombol */
            margin-top: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 200px;
            touch-action: manipulation;
        }

        #btn-mau {
            background: var(--primary-pink);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
            z-index: 2;
        }

        #btn-tidak {
            background: white;
            color: var(--primary-pink);
            position: relative;
            z-index: 1;
        }

        /* Halaman Sukses */
        #success-page {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-hearts" id="hearts-container"></div>

    <div class="card" id="main-card">
        <span class="emoji-main">💖</span>
        <h1 id="question">Will you be mine? ✨</h1>
        <div class="btn-container">
            <button id="btn-mau" onclick="accepted()">Mau! 🥰</button>
            <button id="btn-tidak" onmouseover="moveButton()" onclick="moveButton()">Enggak 😋</button>
        </div>
    </div>

    <div class="card" id="success-page">
        <span class="emoji-main">🎉</span>
        <h1>Yeeay! I Love You! ❤️</h1>
        <p style="color: #c9184a;">Makasih udah nerima aku, cantik! 🌸✨</p>
        <span style="font-size: 3rem; display: block; margin-top: 15px;">👩‍❤️‍👨</span>
    </div>

    <script>
    // Efek Bunga Berjatuhan (Tetap Sama)
    function createHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '🌸';
        heart.style.position = 'absolute';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = '-20px';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heart.style.opacity = Math.random();
        heart.style.zIndex = '1';
        heart.style.pointerEvents = 'none';
        
        document.body.appendChild(heart);

        const duration = Math.random() * 3 + 2; 
        heart.animate([
            { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
            { transform: `translateY(110vh) rotate(360deg)`, opacity: 0 }
        ], {
            duration: duration * 1000,
            easing: 'linear'
        });

        setTimeout(() => heart.remove(), duration * 1000);
    }
    setInterval(createHeart, 300);

    // FIX: Logika Tombol Tidak Mau Agar Tidak Hilang
    function moveButton() {
        const btn = document.getElementById('btn-tidak');
        
        // Mengambil ukuran layar iPhone secara real-time
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        // Mengambil ukuran tombol itu sendiri
        const btnWidth = btn.offsetWidth;
        const btnHeight = btn.offsetHeight;

        // Tentukan batas aman (padding 30px agar tidak mepet notch atau pinggiran)
        const margin = 30;

        // Kalkulasi posisi acak yang tetap di dalam layar
        // Rumus: Random * (LebarLayar - LebarTombol - Margin)
        const randomX = Math.floor(Math.random() * (screenWidth - btnWidth - (margin * 2))) + margin;
        const randomY = Math.floor(Math.random() * (screenHeight - btnHeight - (margin * 2))) + margin;

        // Terapkan posisi baru
        btn.style.position = 'fixed';
        btn.style.zIndex = '999'; // Pastikan paling atas
        btn.style.left = randomX + 'px';
        btn.style.top = randomY + 'px';
        btn.style.transition = 'all 0.2s ease'; // Gerakan sedikit lebih cepat agar sulit ditekan
    }

    // Fungsi Transisi ke Halaman Sukses
    function accepted() {
        const mainCard = document.getElementById('main-card');
        const successPage = document.getElementById('success-page');
        const btnTidak = document.getElementById('btn-tidak');

        // Sembunyikan tombol tidak mau secara permanen
        btnTidak.style.display = 'none';

        // Animasi transisi canggih
        mainCard.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
        mainCard.style.transform = 'scale(0) rotate(-20deg)';
        mainCard.style.opacity = '0';

        setTimeout(() => {
            mainCard.style.display = 'none';
            successPage.style.display = 'block';
            
            // Efek Confetti Sederhana
            for(let i=0; i<50; i++) {
                createSparkle();
            }

            setTimeout(() => {
                successPage.style.opacity = '1';
                successPage.style.transform = 'scale(1)';
            }, 50);
        }, 600);
    }

    function createSparkle() {
        const sparkle = document.createElement('div');
        sparkle.style.position = 'fixed';
        sparkle.style.width = '10px';
        sparkle.style.height = '10px';
        sparkle.style.backgroundColor = ['#ff4d6d', '#ffb3c1', '#ffffff', '#ffd700'][Math.floor(Math.random()*4)];
        sparkle.style.borderRadius = '50%';
        sparkle.style.left = '50%';
        sparkle.style.top = '50%';
        sparkle.style.zIndex = '1000';
        
        document.body.appendChild(sparkle);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 200 + 100;
        const destinationX = Math.cos(angle) * velocity;
        const destinationY = Math.sin(angle) * velocity;

        sparkle.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 1 },
            { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
        ], {
            duration: 1000,
            easing: 'ease-out'
        });

        setTimeout(() => sparkle.remove(), 1000);
    }
</script>
</body>
</html>
