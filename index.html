<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Untuk Kamu 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  width: 390px;
  height: 844px;
  overflow: hidden;
  background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ffdde1);
  animation: bgMove 6s infinite alternate;
}

@keyframes bgMove {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(40deg); }
}

.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 28px;
}

p {
  font-size: 18px;
  margin: 20px 0;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

button {
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.9);
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  box-shadow: 0 0 20px pink;
}

#noBtn {
  background: white;
  color: #ff4d6d;
  position: relative;
}

.hidden {
  display: none;
}

/* efek hati */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-200px); opacity: 0; }
}

/* transisi */
.fade-out {
  animation: fadeOut 0.5s forwards;
}

.fade-in {
  animation: fadeIn 0.5s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; transform: scale(0.9); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(1.1); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="container" id="page1">
  <h1>Hai Kamu 💕</h1>
  <p>Mau jadi pacarku gak? 🥺💖</p>

  <div class="buttons">
    <button id="yesBtn">💖 Mau</button>
    <button id="noBtn">😢 Tidak Mau</button>
  </div>
</div>

<div class="container hidden" id="page2">
  <h1>AKU SENANG BANGET 😍💖</h1>
  <p>Kamu sekarang jadi pacarku 💕</p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

// efek hati
function createHeart(x, y) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = "💖";
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 3000);
}

// tombol tidak mau kabur tapi tetap di layar
function moveButton() {
  const x = Math.random() * 330;
  const y = Math.random() * 700;

  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

// tombol mau
yesBtn.addEventListener("click", () => {

  // efek tekan + glow
  yesBtn.style.transform = "scale(1.2)";
  yesBtn.style.boxShadow = "0 0 40px pink";

  // efek hati banyak
  for (let i = 0; i < 20; i++) {
    createHeart(Math.random() * 390, Math.random() * 844);
  }

  page1.classList.add("fade-out");

  setTimeout(() => {
    page1.classList.add("hidden");
    page2.classList.remove("hidden");
    page2.classList.add("fade-in");
  }, 500);
});
</script>

</body>
</html>
