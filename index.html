<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>For You 💖</title>
    <style>
        :root {
            --pink-bg: #ff9a9e;
            --pink-btn: #ff4d6d;
        }

        /* Full Screen Setup untuk iPhone 13 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, var(--pink-bg) 0%, #fad0c4 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            display: flex; justify-content: center; align-items: center;
        }

        /* Kontainer Utama */
        #main-container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 350px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .emoji { font-size: 80px; margin-bottom: 10px; display: block; }
        
        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 40px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            line-height: 1.3;
        }

        /* Tombol & Jarak */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Jarak antara Mau dan Gak Mau */
        }

        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 800;
            transition: 0.2s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }

        #yesBtn {
            background: var(--pink-btn);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            z-index: 100;
        }

        #noBtn {
            background: white;
            color: var(--pink-btn);
            z-index: 99;
        }

        /* Halaman Sukses */
        #success-page {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--pink-btn);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .shake { animation: shake-card 0.3s; }
        @keyframes shake-card {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <span class="emoji">🥺🌷</span>
        <h1>Hallo Sayaaangggg.....<br>Mau gak jadi pacar aku?</h1>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="diterima()">MAAUUU!!! 🥰</button>
            
            <button id="noBtn">GAAAKKK MAUUU!!!😋</button>
        </div>
    </div>

    <div id="success-page">
        <span style="font-size: 100px;">💖👑</span>
        <h1 style="font-size: 32px;">ASIIIQQQQ I LOVE U SAYAAANNGGG!!!!</h1>
        <p style="font-size: 18px;">MAUUUU CIIIUUUMMMM IIIIHHHHH!!!!!!!</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const card = document.getElementById('main-container');
        const successPage = document.getElementById('success-page');

        function lari(e) {
            if (e) e.preventDefault();
            
            // Efek getar visual pada card saat tombol kabur
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 300);

            // MENGHITUNG AREA AMAN (Safe Area) iPhone 13
            // Margin agar tidak tertutup notch atau menempel ke pinggir layar
            const margin = 50; 
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            const buttonWidth = noBtn.offsetWidth;
            const buttonHeight = noBtn.offsetHeight;

            // Logika agar tetap di dalam layar
            const newX = Math.random() * (screenWidth - buttonWidth - (margin * 2)) + margin;
            const newY = Math.random() * (screenHeight - buttonHeight - (margin * 2)) + margin;

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        }

        // Event listener khusus touch (lebih responsif di iOS)
        noBtn.addEventListener('touchstart', lari);
        noBtn.addEventListener('click', lari);

        function diterima() {
            // Animasi transisi Full Screen
            card.style.transform = "scale(5)";
            card.style.opacity = "0";
            
            setTimeout(() => {
                successPage.style.display = 'flex';
                // Trigger confetti sederhana via emoji
                spawnHearts();
            }, 300);
        }

        function spawnHearts() {
            for(let i=0; i<15; i++) {
                const h = document.createElement('div');
                h.innerHTML = '❤️';
                h.style.position = 'fixed';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.top = '100vh';
                h.style.fontSize = '24px';
                h.style.transition = '3s';
                document.body.appendChild(h);
                setTimeout(() => {
                    h.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                    h.style.opacity = '0';
                }, 100);
            }
        }
    </script>
</body>
</html>
