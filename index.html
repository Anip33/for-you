<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Untuk Kamu 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  width: 390px;
  height: 844px;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 28px;
  color: white;
  margin-bottom: 10px;
}

p {
  font-size: 18px;
  color: white;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  box-shadow: 0 0 20px rgba(255, 77, 109, 0.7);
}

#noBtn {
  background: white;
  color: #ff4d6d;
  position: relative;
}

.hidden {
  display: none;
}

/* love jatuh */
.hearts {
  position: absolute;
  top: -50px;
  width: 100%;
  font-size: 20px;
  animation: fall 10s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-50px); }
  100% { transform: translateY(900px); }
}

/* page 2 efek */
.burst {
  font-size: 50px;
  animation: pop 1s infinite;
}

@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.5); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}

/* transisi */
.fade-out {
  animation: fadeOut 0.5s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; transform: scale(0.9); }
}

.fade-in {
  animation: fadeIn 0.5s forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(1.1); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="hearts">💖 💕 💗 💓 💞 💘 💝</div>

<div class="container" id="page1">
  <h1>Hai Kamu 💕</h1>
  <p>Mau jadi pacarku gak? 🥺💖</p>

  <div class="buttons">
    <button id="yesBtn">💖 Mau</button>
    <button id="noBtn">😢 Tidak Mau</button>
  </div>
</div>

<div class="container hidden" id="page2">
  <h1>YAYYYY 😍💖</h1>
  <p>Aku bahagia banget kamu nerima aku 🥺💕</p>
  <div class="burst">💖💖💖</div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

// ukuran layar iPhone 13
const maxX = 330;
const maxY = 700;

// tombol tidak mau kabur tapi tetap di layar
noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

function moveButton() {
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// tombol mau ditekan
yesBtn.addEventListener("click", () => {
  yesBtn.style.transform = "scale(1.3)";
  yesBtn.style.boxShadow = "0 0 40px pink";

  page1.classList.add("fade-out");

  setTimeout(() => {
    page1.classList.add("hidden");
    page2.classList.remove("hidden");
    page2.classList.add("fade-in");
  }, 500);
});
</script>

</body>
</html>
