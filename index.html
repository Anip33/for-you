<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9ecf, #ffc1e3);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* HALAMAN */
.page {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.8s ease;
}

/* TRANSISI */
.hidden {
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
}

/* TEKS */
h1 {
    font-size: 28px;
    color: white;
    text-align: center;
    margin-bottom: 40px;
}

/* BUTTON */
.btn {
    padding: 15px 25px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    margin: 10px;
}

/* Tombol Mau */
.yes {
    background: #ff4fa3;
    color: white;
    box-shadow: 0 0 20px rgba(255, 79, 163, 0.6);
}

/* Tombol Tidak Mau */
.no {
    background: white;
    color: #ff4fa3;
    position: absolute;
}

/* HEART TRAIL */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 1s ease-out forwards;
}

@keyframes float {
    to {
        transform: translateY(-50px);
        opacity: 0;
    }
}

/* HALAMAN 2 */
.success {
    background: linear-gradient(135deg, #ff4fa3, #ff85c1);
    color: white;
    text-align: center;
}

.big-heart {
    font-size: 60px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- HALAMAN 1 -->
<div id="page1" class="page">
    <h1>💖 Kamu mau jadi pacarku? 💖</h1>

    <button class="btn yes" onclick="acceptLove()">😍 Mau</button>
    <button class="btn no" id="noBtn">😢 Tidak Mau</button>
</div>

<!-- HALAMAN 2 -->
<div id="page2" class="page hidden success">
    <div class="big-heart">💖</div>
    <h1>YEAAY!! 🥰💖<br>Aku seneng banget kamu mau! 💕</h1>
</div>

<script>
// BATAS LAYAR IPHONE 13
const maxX = 390 - 120;
const maxY = 844 - 60;

const noBtn = document.getElementById("noBtn");

// POSISI AWAL
let posX = 200;
let posY = 500;

noBtn.style.left = posX + "px";
noBtn.style.top = posY + "px";

// TOMBOL KABUR (TAPI TETAP DALAM LAYAR)
noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("mouseover", moveButton);

function moveButton() {
    let randomX = Math.random() * maxX;
    let randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

// EFEK LOVE TRAIL
document.addEventListener("touchmove", createHeart);
document.addEventListener("mousemove", createHeart);

function createHeart(e) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = (e.touches ? e.touches[0].clientX : e.clientX) + "px";
    heart.style.top = (e.touches ? e.touches[0].clientY : e.clientY) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 1000);
}

// TRANSISI KE HALAMAN 2
function acceptLove() {
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    page1.classList.add("hidden");

    setTimeout(() => {
        page2.classList.remove("hidden");
    }, 500);
}
</script>

</body>
</html>
