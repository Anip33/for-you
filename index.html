<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* PAGE */
.page {
    width: 100%;
    height: 100%;
    position: relative;
}

/* CENTER */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* TEXT */
h1 {
    color: white;
    margin-bottom: 30px;
    font-size: 24px;
}

/* BUTTON */
.btn {
    width: 240px;
    padding: 16px;
    border-radius: 40px;
    border: none;
    font-size: 18px;
}

/* YES */
#yesBtn {
    background: white;
    color: #ff4d6d;
    margin-bottom: 12px;
}

/* NO (selalu absolute biar stabil) */
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
}

/* PAGE 2 */
#page2 {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    text-align: center;
    opacity: 0;
    transform: scale(1.2);
    transition: 0.6s;
}

.show {
    opacity: 1 !important;
    transform: scale(1) !important;
}
</style>
</head>

<body>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<div id="page1" class="page">
    <div class="center">
        <h1>💖 Kamu mau jadi pacarku nggak? 🥺</h1>

        <button id="yesBtn" class="btn">Mau 💕</button>
        <button id="noBtn" class="btn">Tidak 😢</button>
    </div>
</div>

<div id="page2" class="page">
    <div class="center">
        <h1>💖 YAAAY!!! 💖<br>Aku seneng banget 😭💕</h1>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page2 = document.getElementById("page2");
const music = document.getElementById("music");

let escapeMode = false;

/* POSISI AWAL (rapi di bawah tombol mau) */
function setInitialPosition() {
    const yesRect = yesBtn.getBoundingClientRect();

    noBtn.style.left = yesRect.left + "px";
    noBtn.style.top = (yesRect.bottom + 12) + "px";
}

/* GERAK AMAN (tidak dekat tombol mau) */
function moveNoBtnSafe() {
    const w = window.innerWidth - noBtn.offsetWidth;
    const h = window.innerHeight - noBtn.offsetHeight;

    const yesRect = yesBtn.getBoundingClientRect();

    let x, y;
    let safe = false;

    while (!safe) {
        x = Math.random() * w;
        y = Math.random() * h;

        if (
            x > yesRect.right + 30 ||
            x + noBtn.offsetWidth < yesRect.left - 30 ||
            y > yesRect.bottom + 30 ||
            y + noBtn.offsetHeight < yesRect.top - 30
        ) {
            safe = true;
        }
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

/* EVENT ANTI TEMBUS */
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    escapeMode = true;
    moveNoBtnSafe();
});

noBtn.addEventListener("mouseover", (e) => {
    e.stopPropagation();
    escapeMode = true;
    moveNoBtnSafe();
});

noBtn.addEventListener("mouseenter", () => {
    if (escapeMode) moveNoBtnSafe();
});

/* YES BUTTON */
yesBtn.addEventListener("click", () => {
    if (navigator.vibrate) navigator.vibrate(50);
    music.play();
    page2.classList.add("show");
});

/* INIT */
window.onload = setInitialPosition;
window.onresize = setInitialPosition;
</script>

</body>
</html>
