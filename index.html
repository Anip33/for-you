<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special for You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            width: 100vw;
            height: 100dvh; /* Dynamic height untuk iOS 26.1 */
            overflow: hidden;
            background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Hati Melayang */
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 85%;
            max-width: 350px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 40px 25px;
            text-align: center;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .emoji-header {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #590d22;
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            color: #800f2f;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Jarak aman antara tombol Mau dan Enggak */
            align-items: center;
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #btn-yes {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
        }

        #btn-no {
            background: white;
            color: #ff4d6d;
            border: 1px solid #ff4d6d;
            /* Kita kunci ukurannya agar kalkulasi JS akurat */
            min-width: 180px; 
        }

        /* Halaman Sukses */
        #success-page {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s ease;
        }

        .success-emoji {
            font-size: 5rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="floating-hearts" id="heart-box"></div>

    <div class="container" id="main-card">
        <span class="emoji-header">🧸</span>
        <h1>Haii Sayang... ✨</h1>
        <p>Aku mau nanya sesuatu yang serius,<br><b>Kamu mau gak jadi pacarku?</b> 🥺</p>
        
        <div class="btn-wrapper">
            <button class="btn" id="btn-yes" onclick="celebrate()">Mau Banget! 💖</button>
            <button class="btn" id="btn-no" onmouseover="runAway()" onclick="runAway()">Enggak Dulu 😋</button>
        </div>
    </div>

    <div class="container" id="success-page">
        <div class="success-emoji">👩‍❤️‍👨</div>
        <h1>Yeeayy! I Love You! ❤️</h1>
        <p>Hari ini bakal jadi hari yang paling <br>spesial buat aku. Makasih ya! ✨</p>
    </div>

    <script>
        // Efek Hati Berjatuhan
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '🌸';
            heart.style.position = 'absolute';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.opacity = Math.random();
            heart.style.pointerEvents = 'none';
            document.getElementById('heart-box').appendChild(heart);

            const duration = Math.random() * 3 + 3;
            heart.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(110dvh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
            ], { duration: duration * 1000 });

            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(createHeart, 300);

        // LOGIKA KABUR TERBAIK (Khusus iPhone 13)
        function runAway() {
            const btn = document.getElementById('btn-no');
            
            // Padding 60px agar tidak kena Notch atau pinggiran tajam layar
            const padding = 60;
            
            // Kalkulasi Area yang Benar-benar terlihat di layar
            const availableWidth = window.innerWidth - btn.offsetWidth - (padding * 2);
            const availableHeight = window.innerHeight - btn.offsetHeight - (padding * 2);

            // Koordinat Random
            const randomX = Math.floor(Math.random() * availableWidth) + padding;
            const randomY = Math.floor(Math.random() * availableHeight) + padding;

            // Terapkan posisi Fixed
            btn.style.position = 'fixed';
            btn.style.zIndex = '1000';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            
            // Efek mengecil dikit biar makin susah diklik
            btn.style.transform = 'scale(0.95)';
        }

        // TRANSISI CANGGIH
        function celebrate() {
            const main = document.getElementById('main-card');
            const success = document.getElementById('success-page');
            const btnNo = document.getElementById('btn-no');

            // Hapus tombol No
            btnNo.style.display = 'none';

            // Animasi transisi ala aplikasi iOS
            main.style.opacity = '0';
            main.style.transform = 'translateY(-50px) scale(0.9)';
            main.style.transition = '0.5s ease-out';

            setTimeout(() => {
                main.style.display = 'none';
                success.style.display = 'block';
                
                // Trigger masuknya halaman sukses
                setTimeout(() => {
                    success.style.opacity = '1';
                    success.style.transform = 'scale(1)';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
