<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* LOCK SCROLL */
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    background: linear-gradient(135deg, #ff9ecf, #ffc1e3);
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.page {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 1.2s ease;
}

.hidden {
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
}

h1 {
    font-size: 28px;
    color: white;
    text-align: center;
    margin-bottom: 40px;
}

.btn {
    padding: 15px 25px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

.yes {
    background: #ff4fa3;
    color: white;
}

.no {
    background: white;
    color: #ff4fa3;
    position: absolute;
    transition: left 0.25s ease, top 0.25s ease;
}

/* LOVE RAIN */
.rain-container {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.rain-heart {
    position: absolute;
    top: -20px;
    font-size: 18px;
    animation: rain 4s linear forwards;
}

@keyframes rain {
    to {
        transform: translateY(900px);
        opacity: 0;
    }
}

/* HEART TRAIL */
.heart {
    position: absolute;
    font-size: 18px;
    pointer-events: none;
    animation: float 1s forwards;
}

@keyframes float {
    to {
        transform: translateY(-50px);
        opacity: 0;
    }
}

/* SHAKE */
.shake {
    animation: shakeAnim 0.4s;
}

@keyframes shakeAnim {
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-10px); }
}

/* PAGE 2 */
.success {
    background: linear-gradient(135deg, #ff4fa3, #ff85c1);
}

.big-heart {
    font-size: 60px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% { transform: scale(1.2); }
}
</style>
</head>

<body>

<div id="page1" class="page">
    <div class="rain-container" id="rain"></div>

    <h1>💖 Kamu mau jadi pacarku? 💖</h1>

    <button class="btn yes" id="yesBtn" onclick="acceptLove()">😍 Mau</button>
    <button class="btn no" id="noBtn">😢 Tidak Mau</button>
</div>

<div id="page2" class="page hidden success">
    <div class="big-heart">💖</div>
    <h1>YEAAY!! 🥰💖<br>Aku seneng banget kamu mau! 💕</h1>
</div>

<script>
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const rain = document.getElementById("rain");
const page1 = document.getElementById("page1");

const vw = window.innerWidth;
const vh = window.innerHeight;

// POSISI AWAL (di bawah tombol mau)
window.onload = () => {
    const rect = yesBtn.getBoundingClientRect();

    let x = (vw / 2) - (noBtn.offsetWidth / 2);
    let y = rect.bottom + 30;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
};

// LOVE RAIN (STABIL)
setInterval(() => {
    let h = document.createElement("div");
    h.className = "rain-heart";
    h.innerHTML = "💖";

    h.style.left = Math.random() * vw + "px";

    rain.appendChild(h);
    setTimeout(() => h.remove(), 4000);
}, 250);

// MOVE BUTTON (ANTI TABRAK + RESPONSIVE)
noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("mouseover", moveButton);

function moveButton() {
    page1.classList.add("shake");
    setTimeout(() => page1.classList.remove("shake"), 400);

    const yesRect = yesBtn.getBoundingClientRect();

    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    const padding = 60;

    const forbidden = {
        left: yesRect.left - padding,
        right: yesRect.right + padding,
        top: yesRect.top - padding,
        bottom: yesRect.bottom + padding
    };

    let x, y, safe = false;
    let tries = 0;

    while (!safe && tries < 100) {

        x = Math.random() * (vw - btnW);
        y = Math.random() * (vh - btnH);

        safe = !(
            x < forbidden.right &&
            x + btnW > forbidden.left &&
            y < forbidden.bottom &&
            y + btnH > forbidden.top
        );

        tries++;
    }

    if (!safe) {
        x = (vw / 2) - (btnW / 2);
        y = vh - btnH - 30;
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// HEART TRAIL
document.addEventListener("mousemove", createHeart);
document.addEventListener("touchmove", createHeart);

function createHeart(e) {
    let h = document.createElement("div");
    h.innerHTML = "💖";
    h.style.position = "absolute";
    h.style.left = (e.touches ? e.touches[0].clientX : e.clientX) + "px";
    h.style.top = (e.touches ? e.touches[0].clientY : e.clientY) + "px";
    h.style.pointerEvents = "none";

    document.body.appendChild(h);
    setTimeout(() => h.remove(), 800);
}

// ACCEPT LOVE (FULL SCREEN EFFECT)
function acceptLove() {
    let count = 0;
    const total = 600;

    let interval = setInterval(() => {
        for (let i = 0; i < 20; i++) {

            let love = document.createElement("div");
            love.innerHTML = "😍";
            love.style.position = "absolute";
            love.style.left = Math.random() * vw + "px";
            love.style.top = vh + "px";
            love.style.pointerEvents = "none";
            love.style.transition = "1.5s linear";

            document.body.appendChild(love);

            setTimeout(() => {
                love.style.transform = `translateY(-${vh + 200}px)`;
                love.style.opacity = 0;
            }, 10);

            setTimeout(() => love.remove(), 1600);
        }

        count += 20;
        if (count >= total) clearInterval(interval);

    }, 40);

    page1.classList.add("hidden");

    setTimeout(() => {
        document.getElementById("page2").classList.remove("hidden");
    }, 1500);
}
</script>

</body>
</html>
