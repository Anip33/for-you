<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    width: 100vw;
    background: radial-gradient(circle at top, #ff9a9e, #ff4d6d);
}

/* BACKGROUND GLOW */
.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.2);
    filter: blur(100px);
    border-radius: 50%;
    animation: moveGlow 10s infinite alternate;
}

@keyframes moveGlow {
    0% { transform: translate(0,0); }
    100% { transform: translate(100px,200px); }
}

.container {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    text-align: center;
    padding: 20px;
}

h1 {
    color: white;
    font-size: 26px;
    text-shadow: 0 0 15px rgba(255,255,255,0.8);
}

/* BUTTON STYLE */
button {
    padding: 16px 28px;
    border-radius: 25px;
    border: none;
    font-size: 17px;
    cursor: pointer;
    width: 220px;
    margin: 12px;
}

/* YES BUTTON */
#yesBtn {
    background: linear-gradient(45deg, #ff4d6d, #ff85a1);
    color: white;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    transition: all 0.3s ease;
}

#yesBtn:active {
    transform: scale(1.3) rotate(5deg);
    box-shadow: 0 0 50px white;
}

/* NO BUTTON */
#noBtn {
    position: absolute;
    background: white;
    color: #ff4d6d;
}

/* HEART PARTICLE */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh) scale(2);
        opacity: 0;
    }
}

/* CONFETTI */
.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: white;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}

/* PAGE 2 */
.page2 {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #ff4d6d, #ff85a1);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transform: scale(0);
    transition: transform 0.8s cubic-bezier(0.68,-0.55,0.27,1.55);
}

.show {
    transform: scale(1);
}

.love-text {
    color: white;
    font-size: 28px;
    text-align: center;
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
    <h1>💖 Mau jadi pacarku? 🥺💖</h1>

    <button id="yesBtn">Iya aku mau 😳💘</button>
    <button id="noBtn">Tidak mau 🙄</button>
</div>

<div class="page2" id="page2">
    <div class="love-text">
        AKHIRNYA 😭💖<br><br>
        Aku beneran seneng banget! 🥺💕<br>
        Sekarang kita resmi 💘😳
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page2 = document.getElementById("page2");

/* BATAS LAYAR IPHONE 13 */
const maxX = 320;
const maxY = 650;

function moveButton() {
    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

/* HEART GENERATOR */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = ["💖","💘","💕","💓"][Math.floor(Math.random()*4)];

    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*25 + 10) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);
}

setInterval(createHeart, 200);

/* CONFETTI EXPLOSION */
function createConfetti() {
    for(let i=0;i<50;i++){
        const conf = document.createElement("div");
        conf.className = "confetti";

        let x = (Math.random()-0.5)*400 + "px";
        let y = (Math.random()-0.5)*600 + "px";

        conf.style.setProperty("--x", x);
        conf.style.setProperty("--y", y);

        conf.style.left = "50%";
        conf.style.top = "50%";

        document.body.appendChild(conf);

        setTimeout(()=>conf.remove(),1000);
    }
}

/* CLICK YES */
yesBtn.addEventListener("click", ()=>{
    createConfetti();

    for(let i=0;i<40;i++){
        createHeart();
    }

    setTimeout(()=>{
        page2.classList.add("show");
    },500);
});

/* INIT */
moveButton();
</script>

</body>
</html>
