<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You 💖</title>
    <style>
        /* Gaya Dasar & Latar Belakang */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #container {
            text-align: center;
            width: 100%;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .emoji-main {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        /* Tombol - Dioptimalkan untuk Jempol iPhone 13 */
        .btn {
            display: block;
            width: 80%;
            max-width: 280px;
            margin: 20px auto;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 100;
        }

        #noBtn {
            background-color: #ffffff;
            color: #ff4d6d;
            position: relative;
        }

        /* Halaman Sukses */
        #successPage {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ff4d6d;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Animasi */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            animation: move linear infinite;
        }

        @keyframes move {
            to { transform: translateY(-100vh) rotate(360deg); }
        }

        /* Efek Transisi Keren */
        .zoom-out {
            transform: scale(20) !important;
            opacity: 0;
            transition: all 0.6s ease-in-out !important;
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div id="container">
        <span class="emoji-main">🥺👉👈</span>
        <h1>Kamu mau gak jadi pacar aku? ✨</h1>
        
        <button id="yesBtn" class="btn" onclick="acceptLove()">MAAUUU!!! 💖</button>
        
        <button id="noBtn" class="btn" onmouseover="moveNoButton()" onclick="moveNoButton()">GAMAUUU!!! 🙄</button>
    </div>

    <div id="successPage">
        <span style="font-size: 100px;">🎉🥰✨</span>
        <h1 style="font-size: 2.5rem;">YEAYYY! <br> I LOVE U SAYAANNGGGG 💖</h1>
        <p style="font-size: 1.2rem;">MAU CIUM IIIIHHHH!!!!! 🌸</p>
    </div>

    <script>
        // Membuat efek hati melayang
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        // Fungsi memindahkan tombol Tidak Mau
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('container');
            
            // Batasan agar tidak keluar dari layar iPhone 13
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = "fixed";
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        }

        // Fungsi saat diterima
        function acceptLove() {
            const yesBtn = document.getElementById('yesBtn');
            const successPage = document.getElementById('successPage');

            // Efek transisi keren (Zoom)
            yesBtn.classList.add('zoom-out');
            
            setTimeout(() => {
                successPage.style.display = 'flex';
                setTimeout(() => {
                    successPage.style.opacity = '1';
                }, 50);
            }, 400);
        }
    </script>
</body>
</html>
