<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-pink: #ff758f;
            --deep-rose: #ff4d6d;
            --glass: rgba(255, 255, 255, 0.2);
            --border: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Efek Latar Belakang Canggih */
        #canvas-hearts {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Container Utama Sesuai Layar iPhone 13 */
        .container {
            width: 85%;
            max-width: 340px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 35px 25px;
            border: 1.5px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 8px 15px rgba(255, 117, 143, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #590d22;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            color: #800f2f;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Tombol Utama */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Jarak pas antara tombol mau dan tidak */
            align-items: center;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: manipulation;
        }

        #btn-yes {
            background: linear-gradient(45deg, var(--rose-pink), var(--deep-rose));
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        #btn-no {
            background: rgba(255, 255, 255, 0.8);
            color: var(--deep-rose);
            border: 1px solid var(--border);
            /* Pastikan posisi awal relatif agar JS bisa mengatur koordinatnya nanti */
            position: relative; 
        }

        /* Halaman Sukses */
        #success-screen {
            display: none;
            text-align: center;
        }

        .heart-loader {
            font-size: 5rem;
            color: var(--deep-rose);
            margin-bottom: 20px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="canvas-hearts"></canvas>

    <div class="container" id="main-card">
        <div class="avatar">🎁</div>
        <h1>Haii Cantik... ✨</h1>
        <p>Ada yang mau aku omongin, <br>kamu mau gak jadi pacarku? 🥺👉👈</p>
        
        <div class="actions">
            <button class="btn" id="btn-yes" onclick="goSuccess()">Mau Banget! ❤️</button>
            <button class="btn" id="btn-no" onmouseover="dodge()" onclick="dodge()">Enggak Dulu 😋</button>
        </div>
    </div>

    <div class="container" id="success-screen">
        <div class="heart-loader">❤️</div>
        <h1>I Knew It! 🥰</h1>
        <p>Makasih ya udah kasih aku kesempatan. <br>I'll make you the happiest person! 🌸✨</p>
        <button class="btn" id="btn-yes" onclick="location.reload()">Luv You! 😘</button>
    </div>

    <script>
        // Animasi Partikel Hati di Background
        const canvas = document.getElementById('canvas-hearts');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 15 + 5;
                this.speed = Math.random() * 2 + 1;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 77, 109, ${this.opacity})`;
                ctx.font = `${this.size}px Arial`;
                ctx.fillText('❤️', this.x, this.y);
            }
            update() {
                this.y -= this.speed;
                if (this.y < -20) this.y = canvas.height + 20;
            }
        }

        function init() {
            for (let i = 0; i < 25; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        init(); animate();

        // Fitur "Tombol Kabur" yang Anti-Hilang (Optimasi iPhone 13)
        function dodge() {
            const btnNo = document.getElementById('btn-no');
            const padding = 40; // Menjaga jarak dari tepi layar agar tidak tertutup notch/home bar
            
            // Kalkulasi area aman layar
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;

            const newX = Math.max(padding, Math.floor(Math.random() * maxX));
            const newY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNo.style.position = 'fixed';
            btnNo.style.left = `${newX}px`;
            btnNo.style.top = `${newY}px`;
            btnNo.style.zIndex = '999';
            
            // Efek Getar di HP (Haptic Feedback tiruan)
            btnNo.style.transform = 'scale(0.9) rotate(5deg)';
            setTimeout(() => btnNo.style.transform = 'scale(1) rotate(0deg)', 100);
        }

        // Transisi Halus iPhone Style
        function goSuccess() {
            const main = document.getElementById('main-card');
            const success = document.getElementById('success-screen');
            const btnNo = document.getElementById('btn-no');

            btnNo.style.display = 'none';

            // Animasi menghilang (Scale down & Blur)
            main.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
            main.style.transform = 'scale(0.5) translateY(-100px)';
            main.style.filter = 'blur(10px)';
            main.style.opacity = '0';

            setTimeout(() => {
                main.style.display = 'none';
                success.style.display = 'block';
                success.style.opacity = '0';
                success.style.transform = 'scale(1.2)';
                
                // Muncul dengan efek membal (Spring Animation)
                setTimeout(() => {
                    success.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    success.style.opacity = '1';
                    success.style.transform = 'scale(1)';
                }, 50);
            }, 700);
        }
    </script>
</body>
</html>
