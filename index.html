<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    position: relative;
}

/* PAGE */
.page {
    width: 100%;
    height: 100%;
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: all 0.6s ease;
}

/* SECOND PAGE */
#page2 {
    opacity: 0;
    transform: scale(1.2);
    pointer-events: none;
}

/* TEXT */
h1 {
    text-align: center;
    font-size: 24px;
    color: white;
    margin-bottom: 40px;
    padding: 0 20px;
}

/* BUTTONS */
.btn {
    width: 220px;
    padding: 14px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    margin: 10px;
    transition: 0.3s;
}

/* YES BUTTON */
#yesBtn {
    background: white;
    color: #ff4d6d;
    font-weight: bold;
}

/* NO BUTTON */
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
}

/* HEART ANIMATION */
.heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
}

/* TRANSITION EFFECT */
.show {
    opacity: 1 !important;
    transform: scale(1) !important;
    pointer-events: all !important;
}

.hide {
    opacity: 0;
    transform: scale(0.8);
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page">
    <h1>💖 Kamu mau jadi pacarku nggak? 🥺</h1>

    <button id="yesBtn" class="btn">Mau 💕</button>
    <button id="noBtn" class="btn">Tidak 😢</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <h1>💖 YAAAY!!! 💖<br>Aku senang banget kamu nerima aku 😭💕</h1>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

/* INITIAL POSITION NO BUTTON */
let maxWidth = 390 - 220;
let maxHeight = 844 - 100;

function moveNoBtn() {
    let x = Math.random() * maxWidth;
    let y = Math.random() * maxHeight;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

/* MOVE WHEN HOVER / TOUCH */
noBtn.addEventListener("mouseover", moveNoBtn);
noBtn.addEventListener("touchstart", moveNoBtn);

/* YES CLICK EFFECT */
yesBtn.addEventListener("click", () => {
    createHearts();

    page1.classList.add("hide");

    setTimeout(() => {
        page2.classList.add("show");
    }, 400);
});

/* HEART EFFECT */
function createHearts() {
    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";

        heart.style.left = Math.random() * 390 + "px";
        heart.style.bottom = "0px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 3000);
    }
}

/* INIT */
moveNoBtn();
</script>

</body>
</html>
